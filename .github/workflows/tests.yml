name: Tests & Build

on:
  push:
    branches: [ "main", "Aroua-El-Achhab" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Recuperation du code
      uses: actions/checkout@v4

    - name: Configuration de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: ${{ runner.os }}-pip-

    - name: Installation des dependances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lancement des tests
      run: pytest tests/ -v

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Recuperation du code
      uses: actions/checkout@v4

    - name: Build de l'image Docker
      run: docker build -t bmt-app .

    - name: Verification du conteneur
      run: |
        docker run -d --name bmt-test -p 5000:5000 bmt-app
        sleep 5
        curl -f http://localhost:5000/login || exit 1
        docker stop bmt-test
