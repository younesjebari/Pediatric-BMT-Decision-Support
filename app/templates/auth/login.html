{% extends "base.html" %}
{% block title %}Connexion{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card animate-scale-in">
        <div class="auth-header">
            <div class="auth-logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                </svg>
            </div>
            <h2 class="gradient-text">Connexion</h2>
            <p>Connectez-vous pour acceder a MedPredict</p>
        </div>
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label class="form-label">Nom d'utilisateur</label>
                <input type="text" name="username" class="form-input" placeholder="Entrez votre nom d'utilisateur" required autofocus>
            </div>
            <div class="form-group">
                <label class="form-label">Mot de passe</label>
                <input type="password" name="password" class="form-input" placeholder="Entrez votre mot de passe" required>
            </div>
            <button type="submit" class="btn btn-gradient">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                Se Connecter
            </button>
        </form>
        <div class="auth-footer">
            <p>Pas encore de compte ? <a href="{{ url_for('register') }}">Creer un compte</a></p>
        </div>
    </div>
</div>
{% endblock %}
