{% extends "base.html" %}
{% block title %}Inscription{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card animate-scale-in">
        <div class="auth-header">
            <div class="auth-logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/>
                </svg>
            </div>
            <h2 class="gradient-text">Creer un Compte</h2>
            <p>Inscrivez-vous pour utiliser MedPredict</p>
        </div>
        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label class="form-label">Nom d'utilisateur</label>
                <input type="text" name="username" class="form-input" placeholder="Choisissez un nom d'utilisateur" required autofocus minlength="3">
            </div>
            <div class="form-group">
                <label class="form-label">Mot de passe</label>
                <input type="password" name="password" class="form-input" placeholder="Choisissez un mot de passe" required minlength="4">
            </div>
            <div class="form-group">
                <label class="form-label">Confirmer le mot de passe</label>
                <input type="password" name="password_confirm" class="form-input" placeholder="Confirmez votre mot de passe" required minlength="4">
            </div>
            <button type="submit" class="btn btn-gradient">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
                Creer le Compte
            </button>
        </form>
        <div class="auth-footer">
            <p>Deja un compte ? <a href="{{ url_for('login') }}">Se connecter</a></p>
        </div>
    </div>
</div>
{% endblock %}
